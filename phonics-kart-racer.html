<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Articulat-Racer: Phonics Kart Speed</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Outfit:wght@400;600;700;900&display=swap');

    :root {
      --bg: #120c1f;
      --card-bg: #1d152f;
      --red: #e52521;
      --yellow: #ffd800;
      --blue: #2e5cff;
      --green: #43b047;
      --purple: #9b51e0;
      --dark: #090610;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: var(--bg);
      color: #ffffff;
      font-family: 'Outfit', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
      padding: 10px;
    }

    .pixel-font {
      font-family: 'Press Start 2P', monospace;
    }

    .pixel-box {
      border: 3px solid #000000;
      box-shadow: 4px 4px 0px #000000;
    }

    .pixel-btn {
      font-family: 'Press Start 2P', monospace;
      border: 3px solid #000000;
      box-shadow: 4px 4px 0px #000000;
      cursor: pointer;
      transition: transform 0.06s ease, box-shadow 0.06s ease;
      font-size: 11px;
      padding: 10px 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
    }
    .pixel-btn:hover {
      filter: brightness(1.1);
    }
    .pixel-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0px #000000;
    }
    .pixel-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
      box-shadow: 4px 4px 0px #000000;
    }

    #game-container {
      width: 100%;
      max-width: 600px;
      background: var(--card-bg);
      border: 4px solid #000000;
      box-shadow: 8px 8px 0px #000000;
      display: flex;
      flex-direction: column;
      position: relative;
      margin: auto;
    }

    /* Top Bar */
    header {
      background: #150f24;
      padding: 12px 16px;
      border-bottom: 3px solid #000;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .logo-title {
      font-family: 'Press Start 2P', monospace;
      font-size: 13px;
      color: #fff;
      text-shadow: 2px 2px 0px #000;
    }
    .logo-title span { color: var(--yellow); }

    /* Canvas Screen */
    .viewport {
      position: relative;
      background: #000;
      width: 100%;
      aspect-ratio: 4 / 3;
      overflow: hidden;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: pixelated;
    }

    /* Target Word Banner */
    .target-banner {
      background: #171026;
      border-top: 3px solid #000;
      border-bottom: 3px solid #000;
      padding: 8px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .word-spelling {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .letter-slot {
      font-family: 'Press Start 2P', monospace;
      font-size: 15px;
      width: 32px;
      height: 32px;
      background: #2a2044;
      border: 2px solid #000;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 2px 2px 0px #000;
      color: #777;
    }
    .letter-slot.filled {
      background: var(--green);
      color: #fff;
      animation: pop 0.2s ease;
    }
    .letter-slot.active {
      background: var(--yellow);
      color: #000;
      border-color: #fff;
    }

    @keyframes pop {
      0% { transform: scale(0.8); }
      70% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }

    /* Controls HUD */
    .touch-controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 12px;
      background: #120c1f;
      border-top: 3px solid #000;
    }

    .touch-btn {
      font-family: 'Press Start 2P', monospace;
      font-size: 13px;
      padding: 16px;
      background: #372a5a;
      color: #fff;
      border: 3px solid #000;
      box-shadow: 4px 4px 0px #000;
      cursor: pointer;
      touch-action: manipulation;
    }
    .touch-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0px #000;
      background: var(--purple);
    }

    /* Modals & Overlays */
    .modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(10, 6, 18, 0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
      text-align: center;
    }

    .modal-card {
      background: #201738;
      border: 3px solid #000;
      box-shadow: 6px 6px 0px #000;
      padding: 20px;
      max-width: 440px;
      width: 100%;
    }

    .char-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin: 12px 0;
      max-height: 220px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .char-card {
      background: #150f24;
      border: 2px solid #000;
      padding: 6px;
      cursor: pointer;
      font-size: 9px;
      box-shadow: 2px 2px 0px #000;
    }
    .char-card.selected {
      border-color: var(--yellow);
      background: #322554;
    }

    .badge {
      display: inline-block;
      padding: 3px 6px;
      font-size: 9px;
      font-family: 'Press Start 2P', monospace;
      background: var(--yellow);
      color: #000;
      box-shadow: 2px 2px 0px #000;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <header>
      <div>
        <div class="logo-title">ARTICULAT<span>-RACER</span></div>
        <div style="font-size: 11px; color: #a49fc4; margin-top: 3px;">Endless Phonics Kart Speed</div>
      </div>
      <div style="display: flex; gap: 8px; align-items: center;">
        <span class="badge" id="bank-badge">⭐ 100</span>
        <button class="pixel-btn" id="sound-btn" style="background: var(--green); color: #fff; padding: 6px 10px;">
          🔊 AUDIO
        </button>
      </div>
    </header>

    <!-- Target Word Bar -->
    <div class="target-banner">
      <div style="display: flex; align-items: center; gap: 10px;">
        <span id="target-emoji" style="font-size: 26px;">🪭</span>
        <div>
          <div style="font-size: 9px; color: var(--yellow); font-family: 'Press Start 2P', monospace;" id="level-title">LEVEL 1</div>
          <div class="word-spelling" id="slots-container" style="margin-top: 4px;">
            <!-- Injected by script -->
          </div>
        </div>
      </div>
      <div style="text-align: right;">
        <div style="font-size: 9px; font-family: 'Press Start 2P'; color: #8f8bb0;">SCORE</div>
        <div style="font-size: 15px; font-family: 'Press Start 2P'; color: var(--yellow);" id="hud-score">0000</div>
      </div>
    </div>

    <!-- Canvas Game Viewport -->
    <div class="viewport">
      <canvas id="racer-canvas" width="480" height="360"></canvas>

      <!-- Start / Menu Overlay -->
      <div class="modal-overlay" id="home-overlay">
        <div class="modal-card">
          <div style="font-size: 20px; font-family: 'Press Start 2P'; color: var(--yellow); margin-bottom: 6px;">
            START ENGINE!
          </div>
          <p style="font-size: 13px; color: #d2cde8; margin-bottom: 16px;">
            Steer into the correct phonics letter blocks to blend the target words. Avoid distractors!
          </p>

          <div style="margin-bottom: 16px; text-align: left; background: #130d22; padding: 10px; border: 2px solid #000;">
            <div style="font-size: 9px; font-family: 'Press Start 2P'; color: #9a94bd; margin-bottom: 8px;">SELECT DRIVER:</div>
            <div class="char-grid" id="driver-roster"></div>
          </div>

          <div style="display: flex; gap: 8px; justify-content: center;">
            <button class="pixel-btn" id="start-btn" style="background: var(--red); color: #fff; font-size: 13px; padding: 14px 24px;">
              ▶ PLAY NOW
            </button>
            <button class="pixel-btn" id="level-modal-btn" style="background: var(--yellow); color: #000;">
              🏁 LEVELS
            </button>
          </div>
        </div>
      </div>

      <!-- Level Select Overlay -->
      <div class="modal-overlay" id="levels-overlay" style="display: none;">
        <div class="modal-card">
          <div style="font-size: 14px; font-family: 'Press Start 2P'; color: var(--yellow); margin-bottom: 12px;">
            CHOOSE TRACK WORD
          </div>
          <div id="levels-list" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; max-height: 240px; overflow-y: auto; margin-bottom: 16px;"></div>
          <button class="pixel-btn" id="close-levels-btn" style="background: #555; color: #fff;">BACK</button>
        </div>
      </div>

      <!-- Game Over / Victory Overlay -->
      <div class="modal-overlay" id="gameover-overlay" style="display: none;">
        <div class="modal-card">
          <div id="gameover-title" style="font-size: 18px; font-family: 'Press Start 2P'; color: var(--red); margin-bottom: 8px;">
            GAME OVER
          </div>
          <p id="gameover-stats" style="font-size: 13px; color: #d2cde8; margin-bottom: 16px; line-height: 1.6;"></p>
          <div style="display: flex; gap: 8px; justify-content: center;">
            <button class="pixel-btn" id="retry-btn" style="background: var(--green); color: #fff; padding: 12px 20px;">
              🔄 PLAY AGAIN
            </button>
            <button class="pixel-btn" id="home-btn" style="background: #3c3258; color: #fff;">
              🏠 MENU
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- On-screen Touch Controls -->
    <div class="touch-controls">
      <button class="touch-btn" id="btn-left">◀ STEER LEFT (A)</button>
      <button class="touch-btn" id="btn-right">STEER RIGHT (D) ▶</button>
    </div>
  </div>

  <script>
    // --- 1. WORD & CHARACTERS DATABASE ---
    const WORDS = [
      { word: 'FAN', emoji: '🪭', group: 'F' },
      { word: 'FAT', emoji: '🍳', group: 'F' },
      { word: 'FIN', emoji: '🐟', group: 'F' },
      { word: 'HAT', emoji: '🎩', group: 'H' },
      { word: 'HEN', emoji: '🐔', group: 'H' },
      { word: 'HIT', emoji: '⚾', group: 'H' },
      { word: 'MAP', emoji: '🗺️', group: 'M' },
      { word: 'MAT', emoji: '🧘', group: 'M' },
      { word: 'MAN', emoji: '🧑', group: 'M' },
      { word: 'NAP', emoji: '😴', group: 'N' },
      { word: 'NET', emoji: '🥅', group: 'N' },
      { word: 'PAN', emoji: '🍳', group: 'P' },
      { word: 'PAT', emoji: '🐶', group: 'P' },
      { word: 'PEN', emoji: '🖊️', group: 'P' },
      { word: 'PET', emoji: '🐾', group: 'P' }
    ];

    const CHARACTERS = [
      { id: 0, name: 'PETE', cost: 0, carColor: '#e52521', accentColor: '#ffd800' },
      { id: 1, name: 'WRECKER', cost: 60, carColor: '#8a5a2b', accentColor: '#e52521' },
      { id: 2, name: 'FIXIT', cost: 120, carColor: '#2e5cff', accentColor: '#ffd800' },
      { id: 3, name: 'TURBO', cost: 180, carColor: '#43b047', accentColor: '#ffffff' },
      { id: 4, name: 'SPARKY', cost: 240, carColor: '#ffd800', accentColor: '#e52521' },
      { id: 5, name: 'SHADOW', cost: 300, carColor: '#252525', accentColor: '#9b51e0' },
      { id: 6, name: 'COSMIC', cost: 400, carColor: '#9b51e0', accentColor: '#00ffff' },
      { id: 7, name: 'GOLDIE', cost: 500, carColor: '#e6a817', accentColor: '#ffffff' }
    ];

    // --- 2. AUDIO SYNTHESIZER ENGINE (Web Audio API + Speech) ---
    let audioCtx = null;
    let soundEnabled = true;
    let bgmOsc = null;
    let bgmGain = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playTone(freq, duration, type = 'square', gainVal = 0.1) {
      if (!soundEnabled || !audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(gainVal, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function playCoinSound() {
      initAudio();
      playTone(987.77, 0.08, 'square', 0.15);
      setTimeout(() => playTone(1318.51, 0.22, 'square', 0.18), 70);
    }

    function playHitSound() {
      initAudio();
      playTone(180, 0.12, 'sawtooth', 0.2);
    }

    function playWrongSound() {
      initAudio();
      playTone(130, 0.25, 'sawtooth', 0.25);
    }

    function playVictorySound() {
      initAudio();
      const notes = [523.25, 659.25, 783.99, 1046.50];
      notes.forEach((freq, idx) => {
        setTimeout(() => playTone(freq, 0.2, 'square', 0.2), idx * 120);
      });
    }

    function speakLetterOrWord(text, isWord = false) {
      if (!('speechSynthesis' in window)) return;
      try {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text.toLowerCase());
        utter.rate = isWord ? 0.9 : 0.8;
        utter.pitch = 1.1;
        utter.volume = soundEnabled ? 1 : 0;
        window.speechSynthesis.speak(utter);
      } catch(e) {}
    }

    // --- 3. GAME STATE & VARIABLES ---
    let currentLevel = 0;
    let selectedCharId = 0;
    let ownedChars = [0];
    let bank = 100;
    let score = 0;
    let combo = 0;
    let wordsBlended = 0;
    let blendCount = 0;
    let lives = 3;
    let targetIndex = 0;
    let currentLane = 1; // 0: Left, 1: Center, 2: Right
    let targetLane = 1;
    let kartX = 240;
    let kartSpeed = 6;
    let isPlaying = false;
    let isGameOver = false;

    // Road & Blocks
    let roadY = 0;
    let blocks = [];
    let coins = [];
    let particles = [];
    let spawnTimer = 0;
    let spawnInterval = 105; // decreases as player blends 5+ times

    const canvas = document.getElementById('racer-canvas');
    const ctx = canvas.getContext('2d');
    const LANES = [140, 240, 340];

    // Load Local Storage
    try {
      const savedBank = localStorage.getItem('ar_bank');
      if (savedBank) bank = parseInt(savedBank, 10);
      const savedOwned = localStorage.getItem('ar_owned');
      if (savedOwned) ownedChars = JSON.parse(savedOwned);
    } catch(e) {}

    function saveState() {
      try {
        localStorage.setItem('ar_bank', bank);
        localStorage.setItem('ar_owned', JSON.stringify(ownedChars));
      } catch(e) {}
    }

    // --- 4. UI MANAGERS ---
    const hudScore = document.getElementById('hud-score');
    const levelTitle = document.getElementById('level-title');
    const targetEmoji = document.getElementById('target-emoji');
    const slotsContainer = document.getElementById('slots-container');
    const bankBadge = document.getElementById('bank-badge');
    const driverRoster = document.getElementById('driver-roster');
    const homeOverlay = document.getElementById('home-overlay');
    const levelsOverlay = document.getElementById('levels-overlay');
    const gameoverOverlay = document.getElementById('gameover-overlay');

    function updateBankBadge() {
      bankBadge.textContent = '⭐ ' + bank;
      saveState();
    }

    function renderDriverRoster() {
      driverRoster.innerHTML = '';
      CHARACTERS.forEach(char => {
        const isOwned = ownedChars.includes(char.id);
        const isSelected = selectedCharId === char.id;
        const div = document.createElement('div');
        div.className = 'char-card' + (isSelected ? ' selected' : '');
        div.innerHTML = `
          <div style="width: 100%; height: 28px; background: ${char.carColor}; border: 1px solid #000; margin-bottom: 4px; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:bold; font-size:9px;">
            🏎️
          </div>
          <div style="font-family:'Press Start 2P'; font-size:7px; white-space:nowrap; overflow:hidden;">${char.name}</div>
          <div style="color: ${isOwned ? 'var(--green)' : 'var(--yellow)'}; font-size:8px; margin-top:2px;">
            ${isOwned ? 'OWNED' : '⭐ ' + char.cost}
          </div>
        `;
        div.onclick = () => {
          if (isOwned) {
            selectedCharId = char.id;
            renderDriverRoster();
            playCoinSound();
          } else if (bank >= char.cost) {
            bank -= char.cost;
            ownedChars.push(char.id);
            selectedCharId = char.id;
            updateBankBadge();
            renderDriverRoster();
            playVictorySound();
          } else {
            playWrongSound();
            alert('Need ' + char.cost + ' stars! Collect stars on the track.');
          }
        };
        driverRoster.appendChild(div);
      });
    }

    function updateTargetBanner() {
      const curWord = WORDS[currentLevel];
      levelTitle.textContent = 'LEVEL ' + (currentLevel + 1) + ' OF ' + WORDS.length;
      targetEmoji.textContent = curWord.emoji;
      slotsContainer.innerHTML = '';

      for (let i = 0; i < curWord.word.length; i++) {
        const slot = document.createElement('div');
        slot.className = 'letter-slot' + (i < targetIndex ? ' filled' : (i === targetIndex ? ' active' : ''));
        slot.textContent = curWord.word[i];
        slotsContainer.appendChild(slot);
      }
    }

    // --- 5. GAMEPLAY LOGIC ---
    function startRun() {
      initAudio();
      isPlaying = true;
      isGameOver = false;
      score = 0;
      combo = 0;
      wordsBlended = 0;
      blendCount = 0;
      lives = 3;
      targetIndex = 0;
      currentLane = 1;
      targetLane = 1;
      kartX = LANES[1];
      kartSpeed = 6;
      spawnInterval = 105;
      blocks = [];
      coins = [];
      particles = [];

      homeOverlay.style.display = 'none';
      gameoverOverlay.style.display = 'none';
      levelsOverlay.style.display = 'none';

      updateTargetBanner();
      speakLetterOrWord(WORDS[currentLevel].word[0]);
    }

    function spawnGameElements() {
      const curWord = WORDS[currentLevel];
      const targetLetter = curWord.word[targetIndex];

      // Lane selection
      const targetL = Math.floor(Math.random() * 3);
      const distractors = ['B', 'S', 'T', 'M', 'P', 'D', 'K', 'L', 'R'].filter(l => l !== targetLetter);

      for (let l = 0; l < 3; l++) {
        if (l === targetL) {
          blocks.push({
            x: LANES[l],
            y: -50,
            letter: targetLetter,
            isTarget: true,
            color: '#ffd800'
          });
        } else if (Math.random() > 0.3) {
          const randL = distractors[Math.floor(Math.random() * distractors.length)];
          blocks.push({
            x: LANES[l],
            y: -50,
            letter: randL,
            isTarget: false,
            color: '#ffffff'
          });
        }
      }

      // Occasional star coin
      if (Math.random() > 0.5) {
        const coinLane = (targetL + 1) % 3;
        coins.push({
          x: LANES[coinLane],
          y: -90,
          radius: 12
        });
      }
    }

    function addExplosion(x, y, color = '#ffd800', count = 12) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x: x,
          y: y,
          vx: (Math.random() - 0.5) * 8,
          vy: (Math.random() - 0.5) * 8,
          alpha: 1,
          color: color,
          size: Math.random() * 6 + 3
        });
      }
    }

    function gameOver() {
      isPlaying = false;
      isGameOver = true;
      playWrongSound();
      const stats = document.getElementById('gameover-stats');
      stats.innerHTML = `Final Score: <b>${score}</b><br>Words Blended: <b>${wordsBlended}</b><br>Stars Banked: <b>${bank}</b>`;
      gameoverOverlay.style.display = 'flex';
    }

    // --- 6. RENDER & LOOP ---
    function drawKart(ctx, x, y, char) {
      // Wheels
      ctx.fillStyle = '#111111';
      ctx.fillRect(x - 22, y - 18, 8, 14);
      ctx.fillRect(x + 14, y - 18, 8, 14);
      ctx.fillRect(x - 24, y + 8, 10, 16);
      ctx.fillRect(x + 14, y + 8, 10, 16);

      // Chassis
      ctx.fillStyle = char.carColor;
      ctx.fillRect(x - 16, y - 14, 32, 38);

      // Accent Stripe
      ctx.fillStyle = char.accentColor;
      ctx.fillRect(x - 4, y - 14, 8, 38);

      // Nose cone & Spoiler
      ctx.fillStyle = '#111';
      ctx.fillRect(x - 18, y + 20, 36, 6);
      ctx.fillRect(x - 12, y - 18, 24, 6);

      // Driver Helmet
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(x, y + 4, 8, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#111';
      ctx.fillRect(x - 5, y + 1, 10, 4);
    }

    function gameLoop() {
      requestAnimationFrame(gameLoop);

      // Clear Screen
      ctx.fillStyle = '#1a132b';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Road Curbs & Track
      const roadLeft = 80;
      const roadWidth = 320;
      ctx.fillStyle = '#261c3b';
      ctx.fillRect(roadLeft, 0, roadWidth, canvas.height);

      // Scroll Road Stripes & Curbs
      roadY = (roadY + kartSpeed) % 40;

      // Curbs
      for (let y = -40 + roadY; y < canvas.height; y += 40) {
        ctx.fillStyle = ((Math.floor((y - roadY) / 40) % 2) === 0) ? '#e52521' : '#ffffff';
        ctx.fillRect(roadLeft - 14, y, 14, 40);
        ctx.fillRect(roadLeft + roadWidth, y, 14, 40);

        // Lane divider dashed lines
        ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
        ctx.fillRect(190, y, 4, 20);
        ctx.fillRect(290, y, 4, 20);
      }

      if (isPlaying) {
        // Smooth Kart Lane Transition
        kartX += (LANES[targetLane] - kartX) * 0.22;

        // Spawning
        spawnTimer++;
        if (spawnTimer >= spawnInterval) {
          spawnTimer = 0;
          spawnGameElements();
        }

        // Update & Draw Coins
        for (let i = coins.length - 1; i >= 0; i--) {
          const coin = coins[i];
          coin.y += kartSpeed;

          // Draw Coin
          ctx.fillStyle = '#ffd800';
          ctx.beginPath();
          ctx.arc(coin.x, coin.y, 10, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#ffffff';
          ctx.font = '10px "Press Start 2P"';
          ctx.fillText('★', coin.x - 5, coin.y + 4);

          // Collision with Kart
          if (Math.hypot(coin.x - kartX, coin.y - 300) < 26) {
            bank += 1;
            score += 25;
            hudScore.textContent = score.toString().padStart(4, '0');
            updateBankBadge();
            playCoinSound();
            addExplosion(coin.x, coin.y, '#ffd800', 8);
            coins.splice(i, 1);
            continue;
          }

          if (coin.y > canvas.height + 40) {
            coins.splice(i, 1);
          }
        }

        // Update & Draw Letter Blocks
        for (let i = blocks.length - 1; i >= 0; i--) {
          const b = blocks[i];
          b.y += kartSpeed;

          // Block Box
          ctx.fillStyle = b.isTarget ? '#ffd800' : '#372a5a';
          ctx.fillRect(b.x - 24, b.y - 24, 48, 48);
          ctx.strokeStyle = '#000000';
          ctx.lineWidth = 3;
          ctx.strokeRect(b.x - 24, b.y - 24, 48, 48);

          // Letter Text
          ctx.fillStyle = b.isTarget ? '#000000' : '#ffffff';
          ctx.font = 'bold 22px "Press Start 2P", monospace';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(b.letter, b.x, b.y);

          // Collision with Kart
          if (Math.abs(b.x - kartX) < 32 && Math.abs(b.y - 300) < 34) {
            if (b.isTarget) {
              // Correct Letter Hit!
              playHitSound();
              addExplosion(b.x, b.y, '#43b047', 16);
              targetIndex++;
              combo++;
              score += 100 * combo;
              hudScore.textContent = score.toString().padStart(4, '0');

              const curWord = WORDS[currentLevel];
              if (targetIndex >= curWord.word.length) {
                // Word Completed & Blended!
                wordsBlended++;
                blendCount++;
                bank += 5;
                updateBankBadge();
                playVictorySound();

                // Say blended word
                speakLetterOrWord(curWord.word, true);

                // If blended 5 times, ease speed gap
                if (blendCount >= 5) {
                  spawnInterval = Math.max(65, spawnInterval - 8);
                }

                // Advance level
                currentLevel = (currentLevel + 1) % WORDS.length;
                targetIndex = 0;
                updateTargetBanner();
              } else {
                updateTargetBanner();
                speakLetterOrWord(curWord.word[targetIndex]);
              }
            } else {
              // Hit Distractor Letter
              playWrongSound();
              addExplosion(b.x, b.y, '#e52521', 12);
              lives--;
              combo = 0;
              if (lives <= 0) {
                gameOver();
              }
            }
            blocks.splice(i, 1);
            continue;
          }

          if (b.y > canvas.height + 60) {
            blocks.splice(i, 1);
          }
        }

        // Draw Player Kart
        const char = CHARACTERS.find(c => c.id === selectedCharId) || CHARACTERS[0];
        drawKart(ctx, kartX, 300, char);

        // Exhaust Particles
        if (Math.random() > 0.4) {
          particles.push({
            x: kartX - 8 + Math.random() * 16,
            y: 324,
            vx: (Math.random() - 0.5) * 2,
            vy: Math.random() * 3 + 2,
            alpha: 0.8,
            color: '#777777',
            size: Math.random() * 5 + 3
          });
        }
      } else {
        // Idle screen kart preview
        const char = CHARACTERS.find(c => c.id === selectedCharId) || CHARACTERS[0];
        drawKart(ctx, 240, 260, char);
      }

      // Update & Draw Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= 0.03;
        if (p.alpha <= 0) {
          particles.splice(i, 1);
          continue;
        }
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.alpha;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }
    }

    // --- 7. CONTROLS & LISTENERS ---
    function steerLeft() {
      if (!isPlaying) return;
      if (targetLane > 0) {
        targetLane--;
        playTone(340, 0.04, 'triangle', 0.05);
      }
    }

    function steerRight() {
      if (!isPlaying) return;
      if (targetLane < 2) {
        targetLane++;
        playTone(340, 0.04, 'triangle', 0.05);
      }
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') steerLeft();
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') steerRight();
    });

    document.getElementById('btn-left').addEventListener('click', steerLeft);
    document.getElementById('btn-right').addEventListener('click', steerRight);

    document.getElementById('start-btn').addEventListener('click', startRun);
    document.getElementById('retry-btn').addEventListener('click', startRun);
    document.getElementById('home-btn').addEventListener('click', () => {
      gameoverOverlay.style.display = 'none';
      homeOverlay.style.display = 'flex';
    });

    // Level Picker
    document.getElementById('level-modal-btn').addEventListener('click', () => {
      const list = document.getElementById('levels-list');
      list.innerHTML = '';
      WORDS.forEach((w, idx) => {
        const btn = document.createElement('button');
        btn.className = 'pixel-btn';
        btn.style.padding = '8px';
        btn.style.background = idx === currentLevel ? 'var(--yellow)' : '#271c42';
        btn.style.color = idx === currentLevel ? '#000' : '#fff';
        btn.innerHTML = `${w.emoji} ${w.word}`;
        btn.onclick = () => {
          currentLevel = idx;
          targetIndex = 0;
          updateTargetBanner();
          levelsOverlay.style.display = 'none';
          playCoinSound();
        };
        list.appendChild(btn);
      });
      levelsOverlay.style.display = 'flex';
    });

    document.getElementById('close-levels-btn').addEventListener('click', () => {
      levelsOverlay.style.display = 'none';
    });

    // Audio Toggle
    document.getElementById('sound-btn').addEventListener('click', () => {
      initAudio();
      soundEnabled = !soundEnabled;
      document.getElementById('sound-btn').textContent = soundEnabled ? '🔊 AUDIO' : '🔇 MUTED';
      document.getElementById('sound-btn').style.background = soundEnabled ? 'var(--green)' : '#555';
    });

    // Boot
    renderDriverRoster();
    updateBankBadge();
    updateTargetBanner();
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
